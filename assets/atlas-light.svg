<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: patched llama.cpp emits router logits to a shared ring; xpref reads, predicts, and madvise-prefetches the mmap'd checkpoint into DDR.">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static base connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="212" y1="180" x2="252" y2="180" marker-end="url(#ah-l)"/>
    <line x1="420" y1="180" x2="460" y2="180" marker-end="url(#ah-l)"/>
    <line x1="628" y1="180" x2="668" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (direction = data direction; dasharray period 16, from 32->0 = 2 periods seamless) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="212" y1="180" x2="248" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="180" x2="456" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="628" y1="180" x2="664" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots riding each connector -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M212,180 L248,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M420,180 L456,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M628,180 L664,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: breathing fill-opacity, negative-begin stagger -->
  <g>
    <rect x="44" y="140" width="168" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="128" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">llama.cpp</text>
    <text x="128" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">patched router</text>

    <rect x="252" y="140" width="168" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="336" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">shm ring</text>
    <text x="336" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">router logits</text>

    <rect x="460" y="140" width="168" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="544" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">xpref</text>
    <text x="544" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">n-gram + top-k</text>

    <rect x="668" y="140" width="168" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="752" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">mmap checkpoint</text>
    <text x="752" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">madvise → DDR</text>
  </g>

  <!-- flow legend -->
  <text x="440" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">router logits → predict next-firing experts → madvise(MADV_WILLNEED) ahead of the fire</text>
</svg>
